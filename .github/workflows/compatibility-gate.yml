name: Compatibility gate

# ECOSYSTEM.md section 8 gate #1. The trigger stays manual, as the charter
# says: a maintainer runs this as a step in the gmcrypto-core release runbook,
# before the candidate ships. What stops being manual is the execution.
#
# The job lives in this repository rather than in the core repository because
# this one is private and the core repository is public: a workflow here can
# read public core at any ref for free, while the inverse would mean storing a
# token for a private repository in a public repository's secrets.

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: gmcrypto-core ref to test (branch, tag, or commit SHA)
        required: true
        default: main

permissions:
  contents: read

jobs:
  gate:
    name: Core candidate compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Fetch the gmcrypto-core candidate
        env:
          # Bound through the environment, never interpolated into the shell:
          # this input is attacker-controllable in principle.
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          git clone --no-checkout https://github.com/frankxue831/gm-crypto-rs.git "$RUNNER_TEMP/core-candidate"
          git -C "$RUNNER_TEMP/core-candidate" checkout --detach "$CORE_REF"
      - name: Run compatibility gate
        run: ./ci/check-compatibility-gate.sh "$RUNNER_TEMP/core-candidate" "$RUNNER_TEMP/gate1-evidence.md"
      - name: Upload gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate1-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/gate1-evidence.md
          if-no-files-found: error
          retention-days: 90
