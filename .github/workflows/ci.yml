name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --locked --features aead
      - name: Exercise open-source boundary scanner
        shell: bash
        env:
          # Git Bash copies `ln -s` sources by default; native symlinks keep
          # the self-test's special-file fixtures real on Windows runners.
          MSYS: winsymlinks:nativestrict
        run: sh tests/open_source_boundary.sh

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --locked --features aead

  quality:
    name: Formatting, lint, docs, API, policy, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-05-23 --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned policy and API tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-public-api --version 0.52.0 --locked
      - name: Install pinned workflow checker
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify workflow checker version
        run: case "$(actionlint -version | sed -n '1p')" in 1.7.12|v1.7.12) ;; *) actionlint -version; exit 1 ;; esac
      - run: cargo fmt --all -- --check
      # `fuzz/` declares its own [workspace], so the check above never reaches
      # it -- `--all` means every member of the root workspace, not every
      # workspace in the tree. Formatting drifted there unnoticed until this
      # step existed.
      - name: Verify fuzz workspace formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features aead -- -D warnings
      - run: cargo test --doc --locked
      - run: cargo test --doc --locked --features aead
      - run: RUSTDOCFLAGS="-D missing-docs -D warnings" cargo doc --locked --no-deps
      - run: RUSTDOCFLAGS="-D missing-docs -D warnings" cargo doc --locked --no-deps --features aead
      - run: cargo test --test release_documents --locked
      - name: Exercise release-candidate constructor
        run: sh tests/release_candidate.sh
      - name: Verify workflow contracts
        run: sh tests/workflows.sh
      - name: Exercise public API checker
        run: sh tests/public_api.sh
      - name: Verify public API snapshot
        run: ./ci/check-public-api.sh
      - name: Exercise public fixture checker
        run: sh tests/public_fixtures.sh
      - name: Verify public test fixtures
        run: ./ci/check-public-fixtures.sh
      - name: Exercise cryptographic inventory checker
        run: sh tests/crypto_inventory.sh
      - name: Exercise compatibility gate
        run: sh tests/compatibility_gate.sh
      - name: Verify cryptographic dependency inventory
        run: ./ci/check-crypto-inventory.sh
      - run: cargo deny check
      - name: Verify current checkout boundary
        run: ./ci/check-open-source-boundary.sh --worktree .
      - name: Verify complete repository export
        shell: bash
        run: |
          set -euo pipefail
          export_dir=$(mktemp -d)
          trap 'rm -rf "$export_dir"' EXIT
          mkdir "$export_dir/tree"
          git archive HEAD | tar -x -C "$export_dir/tree"
          ./ci/check-open-source-boundary.sh "$export_dir/tree"
      - name: Build and verify Cargo package
        shell: bash
        run: |
          set -euo pipefail
          package_parent=$(mktemp -d)
          trap 'rm -rf "$package_parent"' EXIT
          ./ci/check-cargo-package.sh "$PWD" "$package_parent/package"

  fuzz-smoke:
    name: Bounded fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-05-23
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned fuzzing tool
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Exercise fuzz runner
        run: sh tests/fuzz_smoke.sh
      - name: Run bounded fuzz smoke
        run: sh ci/fuzz-smoke.sh smoke
