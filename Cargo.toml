[package]
name = "gmcrypto-envelope-lite"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP-neutral SM2/SM3 and SM4 secure-envelope primitives"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/frankxue831/gmcrypto-envelope-lite"
keywords = ["sm2", "sm3", "sm4", "cryptography", "envelope"]
categories = ["cryptography", "encoding"]
exclude = [
    ".github/**",
    ".worktrees/**",
    "api/**",
    "ci/**",
    "deny.toml",
    "fuzz/**",
    "RELEASE_CHECKLIST.md",
    "tests/**",
    "tools/**",
    "docs/superpowers/**",
]

[lib]
name = "gmcrypto_envelope_lite"
path = "src/lib.rs"

[features]
default = []
aead = ["gmcrypto-core/sm4-aead"]

# The examples demonstrate the configuration recommended for new
# integrations, which requires the opt-in AEAD envelope mode; without the
# feature they are skipped rather than silently teaching the legacy wire.
[[example]]
name = "build_request"
required-features = ["aead"]

[[example]]
name = "open_response"
required-features = ["aead"]

[dependencies]
base64 = "0.22.1"
getrandom = { version = "0.4.0", features = ["sys_rng"] }
gmcrypto-core = { version = "1.11", features = ["x509"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1.0"
